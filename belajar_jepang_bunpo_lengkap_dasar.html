 {title:'45. ～てから — setelah melakukan',pattern:'Kata kerja bentuk て + から',ex:'ご飯を食べてから、勉強します。',romaji:'Gohan o tabete kara, benkyou shimasu.',meaning:'Setelah makan, saya belajar.',info:'～てから menunjukkan bahwa kegiatan kedua dilakukan setelah kegiatan pertama selesai.',note:'Urutan: A てから B = setelah A, kemudian B.'},
 {title:'46. ～てもいいですか — meminta izin',pattern:'Kata kerja bentuk て + もいいですか',ex:'ここで座ってもいいですか。',romaji:'Koko de suwatte mo ii desu ka.',meaning:'Bolehkah duduk di sini?',info:'Digunakan untuk meminta izin melakukan sesuatu.',note:'Jawaban bisa berupa はい、いいです atau すみません、ちょっと…。'},
 {title:'47. あります — keberadaan benda',pattern:'Benda は Tempat に あります',ex:'本は机の上にあります。',romaji:'Hon wa tsukue no ue ni arimasu.',meaning:'Buku ada di atas meja.',info:'あります digunakan untuk menyatakan keberadaan benda mati atau tumbuhan dalam pola dasar.',note:'Orang dan hewan menggunakan います.'},
 {title:'48. います — keberadaan orang/hewan',pattern:'Orang/hewan は Tempat に います',ex:'猫は部屋にいます。',romaji:'Neko wa heya ni imasu.',meaning:'Kucing ada di kamar.',info:'います digunakan untuk menyatakan keberadaan orang atau hewan.',note:'Benda mati: あります. Orang/hewan: います.'},
 {title:'49. Posisi ～の上',pattern:'A の 上',ex:'机の上に本があります。',romaji:'Tsukue no ue ni hon ga arimasu.',meaning:'Ada buku di atas meja.',info:'上 (ue) berarti “atas”. Dengan の, kata ini dapat menunjukkan posisi relatif suatu benda.',note:'Pola: A の上に B があります.'},
 {title:'50. Posisi ～の下',pattern:'A の 下',ex:'机の下に猫がいます。',romaji:'Tsukue no shita ni neko ga imasu.',meaning:'Ada kucing di bawah meja.',info:'下 (shita) berarti “bawah”.',note:'Pola: A の下に B があります／います.'},
 {title:'51. Posisi ～の中',pattern:'A の 中',ex:'かばんの中に本があります。',romaji:'Kaban no naka ni hon ga arimasu.',meaning:'Ada buku di dalam tas.',info:'中 (naka) berarti “dalam”.',note:'Pola: A の中に B があります／います.'},
 {title:'52. Posisi ～の前',pattern:'A の 前',ex:'学校の前に車があります。',romaji:'Gakkou no mae ni kuruma ga arimasu.',meaning:'Ada mobil di depan sekolah.',info:'前 (mae) berarti “depan” atau “sebelum”, tergantung konteks.',note:'Pada pola lokasi, 前 menunjukkan posisi di depan.'},
 {title:'53. Posisi ～の後ろ',pattern:'A の 後ろ',ex:'学校の後ろに公園があります。',romaji:'Gakkou no ushiro ni kouen ga arimasu.',meaning:'Ada taman di belakang sekolah.',info:'後ろ (ushiro) berarti “belakang”.',note:'Pola lokasi: A の後ろに B があります.'},
 {title:'54. Posisi ～のとなり',pattern:'A の となり',ex:'銀行のとなりにコンビニがあります。',romaji:'Ginkou no tonari ni konbini ga arimasu.',meaning:'Ada minimarket di sebelah bank.',info:'となり berarti “sebelah” atau “di samping”.',note:'Digunakan untuk menunjukkan posisi yang bersebelahan.'},
 {title:'55. Posisi ～の近く',pattern:'A の 近く',ex:'駅の近くにホテルがあります。',romaji:'Eki no chikaku ni hoteru ga arimasu.',meaning:'Ada hotel di dekat stasiun.',info:'近く (chikaku) berarti “dekat”.',note:'Pola lokasi: A の近くに B があります／います.'},
 {title:'56. Posisi ～の間',pattern:'A と B の 間',ex:'銀行は学校と駅の間にあります。',romaji:'Ginkou wa gakkou to eki no aida ni arimasu.',meaning:'Bank berada di antara sekolah dan stasiun.',info:'間 (aida) digunakan untuk menyatakan posisi “di antara”.',note:'Pola umum: A は B と C の間にあります.'},
 {title:'57. ～ごろ — sekitar waktu',pattern:'Waktu + ごろ',ex:'7時ごろ起きます。',romaji:'Shichi-ji goro okimasu.',meaning:'Saya bangun sekitar jam tujuh.',info:'ごろ menunjukkan perkiraan waktu.',note:'Untuk perkiraan durasi, gunakan くらい／ぐらい.'},
 {title:'58. ～まえに — sebelum',pattern:'Waktu / kata kerja + まえに',ex:'寝る前に歯を磨きます。',romaji:'Neru mae ni ha o migakimasu.',meaning:'Sebelum tidur, saya menggosok gigi.',info:'前に digunakan untuk menyatakan bahwa suatu kegiatan dilakukan sebelum kegiatan atau waktu tertentu.',note:'Kata kerja sebelum 前に memakai bentuk kamus.'},
 {title:'59. ～あとで — setelah',pattern:'Kata benda + のあとで / kata kerja lampau + あとで',ex:'学校のあとで勉強します。',romaji:'Gakkou no ato de benkyou shimasu.',meaning:'Setelah sekolah, saya belajar.',info:'あとで menyatakan waktu setelah suatu kegiatan atau kejadian.',note:'Contoh lain: ご飯を食べたあとで、勉強します.'},
 {title:'60. いつも — selalu',pattern:'いつも + kata kerja',ex:'いつも学校へ行きます。',romaji:'Itsumo gakkou e ikimasu.',meaning:'Saya selalu pergi ke sekolah.',info:'いつも menunjukkan frekuensi yang sangat sering atau selalu.',note:'Kata keterangan frekuensi biasanya diletakkan sebelum kata kerja.'},
 {title:'61. よく — sering',pattern:'よく + kata kerja',ex:'よく本を読みます。',romaji:'Yoku hon o yomimasu.',meaning:'Saya sering membaca buku.',info:'よく menunjukkan bahwa suatu kegiatan dilakukan dengan sering.',note:'よく juga bisa berarti “dengan baik” tergantung konteks.'},
 {title:'62. ときどき — kadang-kadang',pattern:'ときどき + kata kerja',ex:'ときどき映画を見ます。',romaji:'Tokidoki eiga o mimasu.',meaning:'Saya kadang-kadang menonton film.',info:'ときどき menunjukkan frekuensi yang tidak selalu terjadi.',note:'Letaknya umumnya sebelum kata kerja.'},
 {title:'63. あまり～ません — tidak terlalu',pattern:'あまり + bentuk negatif',ex:'あまりテレビを見ません。',romaji:'Amari terebi o mimasen.',meaning:'Saya tidak terlalu sering menonton TV.',info:'あまり digunakan bersama bentuk negatif untuk menyatakan sesuatu yang jarang atau tidak terlalu.',note:'Pola: あまり + Vません / Aくないです.'},
 {title:'64. ぜんぜん～ません — sama sekali tidak',pattern:'ぜんぜん + bentuk negatif',ex:'ぜんぜん分かりません。',romaji:'Zenzen wakarimasen.',meaning:'Saya sama sekali tidak mengerti.',info:'ぜんぜん biasanya digunakan bersama bentuk negatif untuk menekankan bahwa sesuatu tidak terjadi sama sekali.',note:'Untuk pemula, ingat pasangan: ぜんぜん + negatif.'},
 {title:'65. A は B より～',pattern:'A は B より + sifat',ex:'東京は大阪より大きいです。',romaji:'Toukyou wa Oosaka yori ookii desu.',meaning:'Tokyo lebih besar daripada Osaka.',info:'より digunakan untuk membandingkan dua hal. A dinyatakan lebih ... daripada B.',note:'Pola: A は B より + kata sifat.'},
 {title:'66. どちらが～ — membandingkan dua pilihan',pattern:'A と B と どちらが～ですか',ex:'犬と猫とどちらが好きですか。',romaji:'Inu to neko to dochira ga suki desu ka.',meaning:'Kamu lebih suka anjing atau kucing?',info:'どちら digunakan untuk menanyakan pilihan atau perbandingan antara dua hal.',note:'Jawaban sering memakai A のほうが～です.'},
 {title:'67. ～のほうが — lebih',pattern:'A のほうが + sifat',ex:'猫のほうが好きです。',romaji:'Neko no hou ga suki desu.',meaning:'Saya lebih suka kucing.',info:'～のほうが digunakan untuk menunjukkan pilihan yang lebih dibandingkan pilihan lain.',note:'Sering dipakai setelah pertanyaan どちらが～ですか.'},
 {title:'68. いちばん — paling',pattern:'Kelompok の中で A が いちばん～です',ex:'果物の中でりんごがいちばん好きです。',romaji:'Kudamono no naka de ringo ga ichiban suki desu.',meaning:'Di antara buah-buahan, saya paling suka apel.',info:'いちばん digunakan untuk menyatakan tingkat paling tinggi dalam suatu kelompok.',note:'Pola dasar: N の中で A がいちばん～.'},
 {title:'69. ～が好きです — suka',pattern:'N が 好きです',ex:'私は日本語が好きです。',romaji:'Watashi wa nihongo ga suki desu.',meaning:'Saya suka bahasa Jepang.',info:'好き adalah kata sifat-na yang digunakan untuk menyatakan kesukaan.',note:'Perhatikan penggunaan が: 日本語が好きです.'},
 {title:'70. ～が嫌いです — tidak suka',pattern:'N が 嫌いです',ex:'私は野菜が嫌いです。',romaji:'Watashi wa yasai ga kirai desu.',meaning:'Saya tidak suka sayuran.',info:'嫌い adalah kata sifat-na untuk menyatakan ketidaksukaan.',note:'Dalam percakapan, gunakan dengan konteks yang sopan.'},
 {title:'71. ～が上手です — pandai',pattern:'N が 上手です',ex:'彼は料理が上手です。',romaji:'Kare wa ryouri ga jouzu desu.',meaning:'Dia pandai memasak.',info:'上手 digunakan untuk menyatakan seseorang terampil dalam suatu hal.',note:'Pola dasar: orang は hal が 上手です.'},
 {title:'72. ～が下手です — kurang pandai',pattern:'N が 下手です',ex:'私は歌が下手です。',romaji:'Watashi wa uta ga heta desu.',meaning:'Saya kurang pandai bernyanyi.',info:'下手 digunakan untuk menyatakan seseorang kurang terampil dalam suatu hal.',note:'Pola: orang は hal が 下手です.'},
 {title:'73. ～ほしいです — menginginkan benda',pattern:'N が ほしいです',ex:'新しいかばんがほしいです。',romaji:'Atarashii kaban ga hoshii desu.',meaning:'Saya ingin tas baru.',info:'ほしい digunakan untuk menyatakan keinginan memiliki suatu benda.',note:'Berbeda dengan ～たいです yang digunakan untuk keinginan melakukan aktivitas.'},
 {title:'74. ～どうですか — bagaimana?',pattern:'N / aktivitas + は どうですか',ex:'日本の生活はどうですか。',romaji:'Nihon no seikatsu wa dou desu ka.',meaning:'Bagaimana kehidupan di Jepang?',info:'どうですか digunakan untuk menanyakan pendapat, keadaan, atau kesan.',note:'Jawaban dapat berupa kata sifat atau penjelasan sederhana.'},
 {title:'75. ～どうして — mengapa',pattern:'どうして + kalimat',ex:'どうして学校を休みましたか。',romaji:'Doushite gakkou o yasumimashita ka.',meaning:'Mengapa tidak masuk sekolah?',info:'どうして digunakan untuk menanyakan alasan.',note:'Jawaban sederhana sering memakai ～からです.'},
 {title:'76. ～からです — karena',pattern:'Alasan + からです',ex:'病気ですから、学校を休みました。',romaji:'Byouki desu kara, gakkou o yasumimashita.',meaning:'Karena sakit, saya tidak masuk sekolah.',info:'から dapat menghubungkan alasan dan hasil. Pada tingkat dasar, artinya “karena”.',note:'Pola sederhana: Alasan + から、hasil.'},
 {title:'77. だから — jadi / oleh karena itu',pattern:'Kalimat. だから、kalimat.',ex:'今日は雨です。だから、出かけません。',romaji:'Kyou wa ame desu. Dakara, dekakemasen.',meaning:'Hari ini hujan. Jadi, saya tidak pergi keluar.',info:'だから menghubungkan alasan sebelumnya dengan kesimpulan atau akibat.',note:'Sering muncul di awal kalimat kedua dalam percakapan.'},
 {title:'78. そして — dan kemudian',pattern:'Kalimat + そして + kalimat',ex:'朝ご飯を食べました。そして、学校へ行きました。',romaji:'Asagohan o tabemashita. Soshite, gakkou e ikimashita.',meaning:'Saya sarapan. Kemudian, saya pergi ke sekolah.',info:'そして menghubungkan informasi atau kejadian yang berurutan.',note:'Dapat diterjemahkan “dan”, “kemudian”, atau “lalu” sesuai konteks.'},
 {title:'79. でも — tetapi',pattern:'Kalimat. でも、kalimat.',ex:'日本語は難しいです。でも、楽しいです。',romaji:'Nihongo wa muzukashii desu. Demo, tanoshii desu.',meaning:'Bahasa Jepang sulit. Tetapi, menyenangkan.',info:'でも digunakan untuk menunjukkan pertentangan dengan informasi sebelumnya.',note:'Di sini でも berfungsi sebagai kata penghubung “tetapi”, berbeda dari でも sebagai partikel.'},
 {title:'80. それから — setelah itu',pattern:'Kalimat. それから、kalimat.',ex:'宿題をします。それから、寝ます。',romaji:'Shukudai o shimasu. Sorekara, nemasu.',meaning:'Saya mengerjakan PR. Setelah itu, saya tidur.',info:'それから menunjukkan urutan kejadian berikutnya.',note:'Mirip “kemudian/setelah itu”.'},
 {title:'81. じゃあ / では — kalau begitu',pattern:'じゃあ、kalimat.',ex:'じゃあ、明日会いましょう。',romaji:'Jaa, ashita aimashou.',meaning:'Kalau begitu, mari bertemu besok.',info:'じゃあ digunakan dalam percakapan untuk beralih ke keputusan atau langkah berikutnya. では lebih formal.',note:'Keduanya sering diterjemahkan “kalau begitu”.'},
 {title:'82. これ・それ・あれ',pattern:'これ / それ / あれ は N です',ex:'これは本です。それはかばんです。',romaji:'Kore wa hon desu. Sore wa kaban desu.',meaning:'Ini buku. Itu tas.',info:'これ berarti benda dekat pembicara, それ dekat lawan bicara, dan あれ jauh dari keduanya.',note:'Kata tunjuk ini berdiri sendiri.'},
 {title:'83. この・その・あの',pattern:'この / その / あの + kata benda',ex:'この本はおもしろいです。',romaji:'Kono hon wa omoshiroi desu.',meaning:'Buku ini menarik.',info:'この・その・あの harus diikuti kata benda.',note:'この = ini, その = itu dekat lawan bicara, あの = itu yang jauh.'},
 {title:'84. ここ・そこ・あそこ',pattern:'ここ / そこ / あそこ + は ...',ex:'ここは学校です。',romaji:'Koko wa gakkou desu.',meaning:'Di sini adalah sekolah.',info:'Digunakan untuk menunjukkan tempat: ここ dekat pembicara, そこ dekat lawan bicara, あそこ jauh dari keduanya.',note:'Bentuk sopan: こちら・そちら・あちら juga dapat dipelajari sebagai tambahan.'},
 {title:'85. Kata tanya だれ / どなた',pattern:'だれ / どなた + ですか',ex:'あの人はだれですか。',romaji:'Ano hito wa dare desu ka.',meaning:'Siapa orang itu?',info:'だれ berarti “siapa”. どなた adalah bentuk yang lebih sopan.',note:'Gunakan どなた ketika ingin lebih sopan kepada lawan bicara.'},
 {title:'86. Kata tanya 何（なに／なん）',pattern:'何 + kata / 何ですか',ex:'これは何ですか。',romaji:'Kore wa nan desu ka.',meaning:'Ini apa?',info:'何 berarti “apa”. Cara baca dapat menjadi なに atau なん tergantung kata yang mengikutinya dan pola kalimat.',note:'Contoh: 何ですか = なんですか; 何を = なにを.'},
 {title:'87. どれ・どの — yang mana',pattern:'どれ / どの + kata benda',ex:'あなたのかばんはどれですか。',romaji:'Anata no kaban wa dore desu ka.',meaning:'Tasmu yang mana?',info:'どれ berdiri sendiri, sedangkan どの harus diikuti kata benda.',note:'どれ = yang mana; どの + N = N yang mana.'},
 {title:'88. どこ — di mana',pattern:'Tempat は どこですか',ex:'トイレはどこですか。',romaji:'Toire wa doko desu ka.',meaning:'Toilet di mana?',info:'どこ digunakan untuk menanyakan tempat atau lokasi.',note:'Untuk orang gunakan だれ, bukan どこ.'},
 {title:'89. いつ — kapan',pattern:'いつ + kata kerja',ex:'いつ日本へ行きますか。',romaji:'Itsu Nihon e ikimasu ka.',meaning:'Kapan pergi ke Jepang?',info:'いつ digunakan untuk menanyakan waktu secara umum.',note:'Jika ingin menanyakan jam secara spesifik, gunakan 何時 (なんじ).'},
 {title:'90. いくら — berapa harga',pattern:'N は いくらですか',ex:'この本はいくらですか。',romaji:'Kono hon wa ikura desu ka.',meaning:'Buku ini berapa harganya?',info:'いくら digunakan untuk menanyakan harga atau jumlah uang.',note:'Jawaban biasanya menggunakan 円.'},
 {title:'91. いくつ — berapa buah/berapa usia',pattern:'N は いくつですか',ex:'りんごはいくつありますか。',romaji:'Ringo wa ikutsu arimasu ka.',meaning:'Ada berapa buah apel?',info:'いくつ dapat digunakan untuk menanyakan jumlah benda dengan penghitung umum dan juga usia dalam pola tertentu.',note:'Untuk benda yang memiliki counter khusus, gunakan counter tersebut.'},
 {title:'92. Counter ～人',pattern:'Angka + 人',ex:'教室に学生が三人います。',romaji:'Kyoushitsu ni gakusei ga sannin imasu.',meaning:'Ada tiga siswa di kelas.',info:'人 digunakan untuk menghitung orang.',note:'Perhatikan bacaan khusus: 一人 ひとり, 二人 ふたり, 三人 さんにん.'},
 {title:'93. Counter ～個',pattern:'Angka + 個',ex:'りんごを三個買いました。',romaji:'Ringo o sanko kaimashita.',meaning:'Saya membeli tiga buah apel.',info:'個 digunakan sebagai counter umum untuk benda kecil atau berbentuk relatif bulat.',note:'Bacaan mengikuti perubahan bunyi tertentu, misalnya 一個 いっこ, 六個 ろっこ.'},
 {title:'94. Counter ～本',pattern:'Angka + 本',ex:'ペンを三本買いました。',romaji:'Pen o sanbon kaimashita.',meaning:'Saya membeli tiga batang pena.',info:'本 digunakan untuk benda panjang dan silindris seperti pena, botol, atau payung.',note:'Bacaannya berubah: 一本 いっぽん, 三本 さんぼん, 六本 ろっぽん.'},
 {title:'95. Counter ～枚',pattern:'Angka + 枚',ex:'紙を二枚ください。',romaji:'Kami o nimai kudasai.',meaning:'Tolong beri saya dua lembar kertas.',info:'枚 digunakan untuk benda tipis dan pipih seperti kertas, foto, atau kaus.',note:'Contoh: 一枚 いちまい, 二枚 にまい.'},
 {title:'96. Counter ～冊',pattern:'Angka + 冊',ex:'本を二冊読みました。',romaji:'Hon o nisatsu yomimashita.',meaning:'Saya membaca dua buku.',info:'冊 digunakan untuk menghitung buku atau benda berjilid.',note:'Contoh: 一冊 いっさつ, 八冊 はっさつ.'},
 {title:'97. Counter ～台',pattern:'Angka + 台',ex:'車が二台あります。',romaji:'Kuruma ga nidai arimasu.',meaning:'Ada dua mobil.',info:'台 digunakan untuk kendaraan, mesin, dan peralatan tertentu.',note:'Contoh: 一台 いちだい.'},
 {title:'98. Counter ～匹',pattern:'Angka + 匹',ex:'猫が二匹います。',romaji:'Neko ga nihiki imasu.',meaning:'Ada dua ekor kucing.',info:'匹 digunakan untuk menghitung hewan kecil seperti kucing, anjing, dan ikan.',note:'Bacaan berubah sesuai angka: 一匹 いっぴき, 三匹 さんびき, 六匹 ろっぴき.'},
 {title:'99. Counter ～歳',pattern:'Angka + 歳',ex:'私は十五歳です。',romaji:'Watashi wa juugo-sai desu.',meaning:'Saya berusia 15 tahun.',info:'歳 digunakan untuk menyatakan umur.',note:'20 tahun memiliki bacaan khusus: 二十歳 はたち.'},
 {title:'100. Counter ～回',pattern:'Angka + 回',ex:'週に三回運動します。',romaji:'Shuu ni sankai undou shimasu.',meaning:'Saya berolahraga tiga kali seminggu.',info:'回 digunakan untuk menghitung berapa kali suatu kegiatan dilakukan.',note:'週に三回 = tiga kali seminggu.'},
 {title:'101. Counter ～階',pattern:'Angka + 階',ex:'三階に教室があります。',romaji:'Sankai ni kyoushitsu ga arimasu.',meaning:'Ada ruang kelas di lantai tiga.',info:'階 digunakan untuk menyatakan lantai gedung.',note:'Perhatikan bacaan: 一階 いっかい, 三階 さんがい.'},
 {title:'102. Counter ～円',pattern:'Angka + 円',ex:'これは五百円です。',romaji:'Kore wa gohyaku-en desu.',meaning:'Ini harganya 500 yen.',info:'円 digunakan untuk menyatakan jumlah uang dalam yen.',note:'Beberapa angka mengalami perubahan bunyi, misalnya 300 = さんびゃく円.'},
 {title:'103. ～時間 — durasi jam',pattern:'Angka + 時間',ex:'二時間勉強しました。',romaji:'Nijikan benkyou shimashita.',meaning:'Saya belajar selama dua jam.',info:'時間 menunjukkan durasi dalam satuan jam.',note:'Bedakan 何時 (jam berapa) dengan 何時間 (berapa jam).'},
 {title:'104. ～分 — menit',pattern:'Angka + 分',ex:'十分待ちました。',romaji:'Juppun machimashita.',meaning:'Saya menunggu sepuluh menit.',info:'分 digunakan untuk menit dan cara bacanya dapat berubah sesuai angka.',note:'Contoh: 1分 いっぷん, 3分 さんぷん, 6分 ろっぷん.'},
 {title:'105. ～日 — hari/durasi',pattern:'Angka + 日',ex:'三日休みます。',romaji:'Mikka yasumimasu.',meaning:'Saya libur selama tiga hari.',info:'日 dapat digunakan untuk tanggal maupun durasi hari, dengan beberapa bacaan khusus.',note:'三日 dapat dibaca みっか ketika berarti tiga hari.'},
 {title:'106. ～週間 — durasi minggu',pattern:'Angka + 週間',ex:'二週間日本にいます。',romaji:'Nishuukan Nihon ni imasu.',meaning:'Saya berada di Jepang selama dua minggu.',info:'週間 digunakan untuk menyatakan durasi dalam minggu.',note:'1 minggu = 一週間 いっしゅうかん.'},
 {title:'107. ～ながら — sambil',pattern:'Kata kerja bentuk ます tanpa ます + ながら',ex:'音楽を聞きながら勉強します。',romaji:'Ongaku o kikinagara benkyou shimasu.',meaning:'Saya belajar sambil mendengarkan musik.',info:'ながら menghubungkan dua kegiatan yang dilakukan pada waktu yang sama.',note:'Untuk N5 inti, pahami sebagai pola tambahan pemula; cakupan ujian dapat berbeda menurut sumber.'},
 {title:'108. ～ことができます — dapat melakukan',pattern:'Kata kerja bentuk kamus + ことができます',ex:'日本語を話すことができます。',romaji:'Nihongo o hanasu koto ga dekimasu.',meaning:'Saya dapat berbicara bahasa Jepang.',info:'Pola ini menyatakan kemampuan melakukan suatu kegiatan.',note:'Kata kerja sebelum ことができます memakai bentuk kamus.'},
 {title:'109. ～ことが好きです — suka melakukan',pattern:'Kata kerja bentuk kamus + ことが好きです',ex:'本を読むことが好きです。',romaji:'Hon o yomu koto ga suki desu.',meaning:'Saya suka membaca buku.',info:'こと mengubah kegiatan menjadi sesuatu yang dapat dibicarakan sebagai kata benda, lalu diikuti 好き.',note:'Ini membantu mengungkapkan hobi atau kesukaan terhadap aktivitas.'},

let bunpoIndex=0;

const modeEl=document.getElementById('mode');
const app=document.getElementById('app');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function learned(type,key){try{return localStorage.getItem('jp-learned-'+type+'-'+key)==='1'}catch(e){return false}}
function markLearned(type,key,val){try{localStorage.setItem('jp-learned-'+type+'-'+key,val?'1':'0')}catch(e){}}
function next(){i++;locked=false;render()}
function resetMode(){i=0;score=0;locked=false;render()}
function filterV(){
 const q=(document.getElementById('vsearch')?.value||'').toLowerCase().trim();
 const list=document.getElementById('vlist'); if(!list)return;
 const rows=V.map((x,n)=>({x,n})).filter(o=>o.x.join(' ').toLowerCase().includes(q));
 list.innerHTML=rows.map(o=>`<div class="vitem" data-word="${escapeHtml(o.x[0])}">
 <label class="memorized"><input type="checkbox" ${learned('v',o.x[0])?'checked':''} aria-label="Tandai hafal"> Hafal</label>
 <span class="vsmall">${o.n+1}.</span> <span class="vjp">${escapeHtml(o.x[0])}</span>
 <div class="vdetail"><span class="vromaji">Romaji: ${escapeHtml(o.x[1])}</span><br>Arti: <b>${escapeHtml(o.x[2])}</b></div></div>`).join('');
 list.querySelectorAll('.vitem').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target.closest('.memorized'))return;el.classList.toggle('open')});
  const cb=el.querySelector('input');
  cb.addEventListener('change',()=>markLearned('v',el.dataset.word,cb.checked));
 });
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const m=modeEl.value;
 if(m==='review'){openReviewMenu();return;}
 if(m==='kana'){openKanaMenu();return;}
 if(m==='bunpo'){openBunpoMenu();return;}
 if(m==='ks'){
  const x=K[i%K.length];
  app.innerHTML=`<h2>🈶 Hafalan Kanji</h2><div class="kanji">${x.k}</div><p><b>Kunyomi:</b> ${x.kun||'—'}</p><p><b>Onyomi:</b> ${x.on||'—'}</p><div class="meaning">${x.arti}</div>
  <label class="learncheck"><input id="kcheck" type="checkbox" ${learned('k',x.k)?'checked':''}> Sudah hafal kanji ini</label>
  <p class="small">Kanji ${i%K.length+1} / ${K.length}</p><button id="next">Kanji berikutnya →</button>`;
  document.getElementById('kcheck').addEventListener('change',e=>markLearned('k',x.k,e.target.checked));
  document.getElementById('next').addEventListener('click',next);
 }else if(m==='kq'){
  const x=K[i%K.length], choices=shuffle([x.arti,...shuffle(K.filter(a=>a.k!==x.k)).slice(0,3).map(a=>a.arti)]);
  app.innerHTML=`<h2>📝 Kuis Kanji</h2><div class="kanji">${x.k}</div><p class="small">Arti kanji di atas adalah...</p>${choices.map(a=>`<button class="choice">${a}</button>`).join('')}<div class="stats"><span>Soal: ${i+1}</span><span>Skor: <b>${score}</b></span></div>`;
  attachChoices(x.arti);
 }else if(m==='kl'){
  const done=K.filter(x=>learned('k',x.k)).length;
  app.innerHTML=`<h2>📋 Daftar Hafalan Kanji</h2><p class="small">Sudah hafal: <b>${done}</b> / ${K.length} · Belum hafal: <b>${K.length-done}</b></p>
  <div class="kfilters"><button data-filter="all">Semua</button><button data-filter="todo">Belum hafal</button><button data-filter="done">Sudah hafal</button></div>
  <div id="klist" class="klist"></div>`;
  function drawKanjiList(filter='all'){
   const list=document.getElementById('klist');
   const rows=K.map((x,n)=>({x,n,done:learned('k',x.k)})).filter(o=>filter==='all'||(filter==='done'?o.done:!o.done));
   list.innerHTML=rows.map(o=>`<div class="krow"><label class="memorized"><input type="checkbox" ${o.done?'checked':''} aria-label="Tandai hafal"> Hafal</label><span class="vsmall">${o.n+1}.</span> <span class="kchar">${o.x.k}</span> <span class="status">${o.done?'Sudah hafal':'Belum hafal'}</span><div class="kmeta">Arti: ${escapeHtml(o.x.arti)} · Kunyomi: ${escapeHtml(o.x.kun||'—')} · Onyomi: ${escapeHtml(o.x.on||'—')}</div></div>`).join('');
   list.querySelectorAll('.krow').forEach((el,j)=>{const obj=rows[j],cb=el.querySelector('input');cb.addEventListener('change',()=>{markLearned('k',obj.x.k,cb.checked);drawKanjiList(filter);});});
   app.querySelectorAll('[data-filter]').forEach(b=>{b.style.opacity=b.dataset.filter===filter?'1':'0.65';b.onclick=()=>drawKanjiList(b.dataset.filter)});
   const d=K.filter(x=>learned('k',x.k)).length;
   app.querySelector('p.small').innerHTML=`Sudah hafal: <b>${d}</b> / ${K.length} · Belum hafal: <b>${K.length-d}</b>`;
  }
  drawKanjiList();
 }else if(m==='vs'){
  app.innerHTML=`<h2>📚 Hafalan Kosakata</h2><input id="vsearch" class="search" placeholder="🔎 Cari Jepang, romaji, atau arti..." autocomplete="off"><p class="small">Tekan kata Jepang untuk melihat romaji dan arti. Centang “Hafal” kalau sudah ingat.</p><div id="vlist" class="vlist"></div>`;
  document.getElementById('vsearch').addEventListener('input',filterV);filterV();
 }else if(m==='vq'){
  const x=V[i%V.length], choices=shuffle([x[0],...shuffle(V.filter(a=>a[0]!==x[0])).slice(0,3).map(a=>a[0])]);
  app.innerHTML=`<h2>🎯 Kuis Kosakata</h2><div class="meaning">${x[2]}</div><p class="small">Bahasa Jepangnya adalah...</p>${choices.map(a=>`<button class="choice">${a}</button>`).join('')}<div class="stats"><span>Soal: ${i+1}</span><span>Skor: <b>${score}</b></span></div>`;
  attachChoices(x[0]);
 }else if(['hs','ts'].includes(m)){
  const data=kanaData(m==='hs'?HIRA:KATA), type=m==='hs'?'h':'t', name=m==='hs'?'Hiragana':'Katakana';
  app.innerHTML=`<h2>${m==='hs'?'あ':'ア'} Hafalan ${name}</h2><p class="small">Baca kana, lalu centang kalau sudah hafal. Romaji bisa ditampilkan dengan menekan kartu.</p><div class="klist">${data.map(([kana,romaji])=>`<div class="krow" style="display:flex;align-items:center;gap:12px"><label class="memorized"><input type="checkbox" data-kana="${kana}" ${learned(type,kana)?'checked':''}> Hafal</label><span class="kchar" style="min-width:65px;text-align:center">${kana}</span><button class="reveal" style="width:auto;flex:1;margin:0">Tampilkan romaji</button><span class="romaji" style="display:none;min-width:42px;font-weight:bold">${romaji}</span></div>`).join('')}</div><p class="small">Total ${data.length} kana</p>`;
  app.querySelectorAll('.krow').forEach(row=>{row.querySelector('.reveal').onclick=()=>{const r=row.querySelector('.romaji');r.style.display=r.style.display==='none'?'inline':'none';row.querySelector('.reveal').textContent=r.style.display==='none'?'Tampilkan romaji':'Sembunyikan'};const cb=row.querySelector('input');cb.onchange=()=>markLearned(type,cb.dataset.kana,cb.checked)});
 }else if(['hq','tq'].includes(m)){
  const data=kanaData(m==='hq'?HIRA:KATA), type=m==='hq'?'Hiragana':'Katakana', x=data[i%data.length];
  const choices=shuffle([x[1],...shuffle(data.filter(a=>a[1]!==x[1])).slice(0,3).map(a=>a[1])]);
  app.innerHTML=`<h2>📝 Kuis ${type}</h2><div class="kanji">${x[0]}</div><p class="small">Cara baca kana di atas adalah...</p>${choices.map(a=>`<button class="choice">${a}</button>`).join('')}<div class="stats"><span>Soal: ${i+1}</span><span>Skor: <b>${score}</b></span></div>`;
  attachChoices(x[1]);
 }
 if(!app.querySelector('.back-btn')) app.insertAdjacentHTML('afterbegin','<button class="back-btn" onclick="openHome()">← Menu utama</button>');
}
function attachChoices(correct){
 const buttons=[...app.querySelectorAll('.choice')];
 buttons.forEach(b=>b.addEventListener('click',()=>{
  if(locked)return;locked=true;
  if(b.textContent===correct){b.classList.add('correct');score++}
  else{b.classList.add('wrong');buttons.find(z=>z.textContent===correct)?.classList.add('correct')}
  app.querySelector('.stats').innerHTML=`<span>Soal: ${i+1}</span><span>Skor: <b>${score}</b></span>`;
  setTimeout(next,b.textContent===correct?550:1000);
 }));
}
modeEl.addEventListener('change',resetMode);
function setMode(m){modeEl.value=m;resetMode();}
function openHome(){setMode('ks');}
function openBunpoMenu(){app.innerHTML=`<button class="back-btn" onclick="openHome()">← Menu utama</button><h2>📘 Bunpō — Tata Bahasa Dasar</h2><p class="small">Belajar pola kalimat dasar dengan penjelasan Indonesia, contoh Jepang, romaji, dan arti.</p>${BUNPO.map((b,n)=>`<div class="menu-row"><div class="menu-title"><b>${b.title}</b><small>${b.pattern}</small></div><button class="mini-btn" onclick="openBunpoLesson(${n})">Pelajari</button></div>`).join('')}<button onclick="startBunpoQuiz()">🎯 Mulai kuis tata bahasa</button>`;}
function openBunpoLesson(n){bunpoIndex=n;const b=BUNPO[n];app.innerHTML=`<button class="back-btn" onclick="openBunpoMenu()">← Daftar materi</button><h2>${b.title}</h2><div class="bunpo-box"><div class="bunpo-section"><span class="bunpo-label">📌 Pengertian / Fungsi</span><br>${b.info}</div><div class="bunpo-section"><span class="bunpo-label">🧩 Pola Kalimat</span><br><b>${b.pattern}</b></div><div class="bunpo-section"><span class="bunpo-label">📝 Contoh Kalimat</span><div class="bunpo-example">${b.ex}</div><div><b>Romaji:</b> ${b.romaji}</div><div><b>Arti:</b> ${b.meaning}</div></div><div class="bunpo-note">💡 <b>Catatan:</b> ${b.note}</div></div><div style="display:flex;gap:8px"><button onclick="openBunpoLesson(${(n+BUNPO.length-1)%BUNPO.length})">← Sebelumnya</button><button onclick="openBunpoLesson(${(n+1)%BUNPO.length})">Berikutnya →</button></div><button class="back-btn" style="margin-top:10px" onclick="startBunpoQuiz()">🎯 Latihan kuis</button>`;}
function startBunpoQuiz(){const n=Math.floor(Math.random()*BUNPO.length),x=BUNPO[n];const options=shuffle([x.meaning,...shuffle(BUNPO.filter((b,j)=>j!==n)).slice(0,3).map(b=>b.meaning)]);app.innerHTML=`<button class="back-btn" onclick="openBunpoMenu()">← Menu Bunpō</button><h2>🎯 Kuis Tata Bahasa</h2><p class="small">Apa arti kalimat ini?</p><div class="meaning" style="font-size:24px">${x.ex}</div><p><b>${x.romaji}</b></p>${options.map(a=>`<button class="choice">${a}</button>`).join('')}<div class="stats"><span>Latihan tata bahasa</span><span>Skor: <b>${score}</b></span></div>`;const buttons=[...app.querySelectorAll('.choice')];buttons.forEach(btn=>btn.onclick=()=>{if(locked)return;locked=true;if(btn.textContent===x.meaning){btn.classList.add('correct');score++}else{btn.classList.add('wrong');buttons.find(z=>z.textContent===x.meaning)?.classList.add('correct')}app.querySelector('.stats').innerHTML=`<span>Latihan tata bahasa</span><span>Skor: <b>${score}</b></span>`;setTimeout(()=>{locked=false;startBunpoQuiz()},900)});}


function openReviewMenu(){
 const kc=K.filter(x=>!learned('k',x.k)).length, vc=V.filter(x=>!learned('v',x[0])).length, hc=HIRA.filter(x=>!learned('h',x[0])).length, tc=KATA.filter(x=>!learned('t',x[0])).length;
 app.innerHTML=`<button class="back-btn" onclick="openHome()">← Menu utama</button><h2>🔁 Pengulangan Hafalan</h2><p class="small">Latihan acak untuk materi yang belum kamu tandai hafal. Jawaban yang salah akan muncul lagi dalam sesi ini.</p>
 ${[['k','Kanji',kc],['v','Kosakata',vc],['h','Hiragana',hc],['t','Katakana',tc]].map(([t,n,c])=>`<div class="menu-row"><div class="menu-title"><b>${n}</b><small>${c} belum ditandai hafal</small></div><button class="mini-btn" onclick="startReview('${t}')">Mulai</button></div>`).join('')}`;
}
function startReview(type){
 reviewType=type; reviewScore=0; reviewIndex=0; reviewLocked=false;
 const pool=type==='k'?K.filter(x=>!learned('k',x.k)):type==='v'?V.filter(x=>!learned('v',x[0])):type==='h'?HIRA.filter(x=>!learned('h',x[0])):KATA.filter(x=>!learned('t',x[0]));
 reviewQueue=shuffle(pool).map(x=>({x,wrong:0}));
 if(!reviewQueue.length){app.innerHTML=`<button class="back-btn" onclick="openReviewMenu()">← Kembali</button><h2>🎉 Semua sudah ditandai hafal!</h2><p class="small">Tidak ada materi yang perlu diulang di kategori ini.</p>`;return;}
 renderReviewQuestion();
}
function renderReviewQuestion(){
 if(reviewIndex>=reviewQueue.length){app.innerHTML=`<button class="back-btn" onclick="openReviewMenu()">← Menu pengulangan</button><h2>🎉 Sesi selesai!</h2><p class="meaning">Skor: ${reviewScore}</p><p class="small">Selesai mengulang ${reviewQueue.length} materi. Tandai materi yang sudah kamu kuasai dari menu Hafalan.</p><button onclick="startReview(reviewType)">Ulangi lagi</button>`;return;}
 const item=reviewQueue[reviewIndex],x=item.x;let prompt,correct,options;
 if(reviewType==='k'){prompt=x.k;correct=x.arti;options=shuffle([correct,...shuffle(K.filter(a=>a.k!==x.k)).slice(0,3).map(a=>a.arti)]);}
 else if(reviewType==='v'){prompt=x[2];correct=x[0];options=shuffle([correct,...shuffle(V.filter(a=>a[0]!==x[0])).slice(0,3).map(a=>a[0])]);}
 else {prompt=x[0];correct=x[1];const data=reviewType==='h'?HIRA:KATA;options=shuffle([correct,...shuffle(data.filter(a=>a[1]!==correct)).slice(0,3).map(a=>a[1])]);}
 app.innerHTML=`<button class="back-btn" onclick="openReviewMenu()">← Menu pengulangan</button><h2>🔁 Latihan ulang — ${reviewType==='k'?'Kanji':reviewType==='v'?'Kosakata':reviewType==='h'?'Hiragana':'Katakana'}</h2><div class="kanji">${prompt}</div><p class="small">${reviewType==='v'?'Pilih kata Jepang yang benar.':reviewType==='k'?'Pilih arti kanji.':'Pilih cara baca yang benar.'}</p>${options.map(a=>`<button class="choice">${a}</button>`).join('')}<div class="stats"><span>Soal ${reviewIndex+1}/${reviewQueue.length}</span><span>Benar: <b>${reviewScore}</b></span></div>`;
 const buttons=[...app.querySelectorAll('.choice')];buttons.forEach(btn=>btn.onclick=()=>{if(reviewLocked)return;reviewLocked=true;const ok=btn.textContent===correct;if(ok){btn.classList.add('correct');reviewScore++;}else{btn.classList.add('wrong');buttons.find(b=>b.textContent===correct)?.classList.add('correct');item.wrong++;}setTimeout(()=>{if(!ok&&item.wrong<2)reviewQueue.push(item);reviewIndex++;reviewLocked=false;renderReviewQuestion();},ok?500:900);});
}

<div class="menu-row"><div class="menu-title"><b>Daftar hafalan</b><small>Cek sudah atau belum hafal</small></div><button class="mini-btn" onclick="setMode('kl')">Buka</button></div>
